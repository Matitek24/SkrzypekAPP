<div class="d-flex" id="wrapper">
  <app-sidebar [activeSection]="currentSection" (sectionChange)="currentSection = $event"></app-sidebar>

  <div class="flex-grow-1" style="background-color: var(--brand-bg); min-height: 100vh;">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3 shadow-sm">
      <div class="container-fluid">
        <div class="d-flex align-items-center">
            <div class="user-avatar-circle me-3">
              {{ username?.charAt(0)?.toUpperCase() || 'U' }}
            </div>
            <span class="fw-bold" style="color: var(--brand-primary)">Cześć, {{ username }}!</span>
        </div>
        <div class="ms-auto">
          <button (click)="onLogout()" class="btn btn-outline-danger rounded-pill px-4 btn-sm fw-bold">
            <i class="bi bi-box-arrow-right me-2"></i>Wyloguj
          </button>
        </div>
      </div>
    </nav>

    <div class="container-fluid p-4">
      
      <div *ngIf="currentSection === 'overview'" class="animate__animated animate__fadeIn">
        <app-overview></app-overview>
      </div>

      <div *ngIf="currentSection === 'budget'" class="animate__animated animate__fadeIn">
        <app-budget></app-budget>
      </div>

    </div>
  </div>
</div>
