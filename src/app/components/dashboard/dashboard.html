<div class="dashboard-wrapper">

  <!-- SIDEBAR -->
  <app-sidebar
    [activeSection]="currentSection"
    (sectionChange)="currentSection = $event">
  </app-sidebar>

  <!-- GLOWNA TRESC -->
  <main class="main-content">

    <div *ngIf="currentSection === 'overview'" class="animate-fade-up">
      <app-overview></app-overview>
    </div>

    <div *ngIf="currentSection === 'budget'">
      <app-budget></app-budget>
    </div>

    <div *ngIf="currentSection === 'transactions'" class="animate-fade-up">
      <app-placeholder-section
        icon="bi bi-arrow-left-right"
        title="Transakcje"
        description="Historia wszystkich operacji na Twoich kontach.">
      </app-placeholder-section>
    </div>

    <div *ngIf="currentSection === 'analytics'" class="animate-fade-up">
      <app-placeholder-section
        icon="bi bi-bar-chart-line"
        title="Analityka"
        description="Wykresy i statystyki dotyczace Twoich finansow.">
      </app-placeholder-section>
    </div>

    <div *ngIf="currentSection === 'portfolio'" class="animate-fade-up">
      <app-placeholder-section
        icon="bi bi-briefcase"
        title="Portfolio"
        description="Twoje projekty i dokonania zawodowe.">
      </app-placeholder-section>
    </div>

    <div *ngIf="currentSection === 'skills'" class="animate-fade-up">
      <app-placeholder-section
        icon="bi bi-code-slash"
        title="Umiejetnosci"
        description="Mapa Twoich technicznych kompetencji.">
      </app-placeholder-section>
    </div>

    <div *ngIf="currentSection === 'deployments'" class="animate-fade-up">
      <app-placeholder-section
        icon="bi bi-cloud-upload"
        title="Wdrozenia"
        description="Status i historia wdrozen aplikacji.">
      </app-placeholder-section>
    </div>

    <div *ngIf="currentSection === 'monitoring'" class="animate-fade-up">
      <app-placeholder-section
        icon="bi bi-activity"
        title="Monitoring"
        description="Wydajnosc i dostepnosc Twoich serwisow.">
      </app-placeholder-section>
    </div>

    <div *ngIf="currentSection === 'goals'" class="animate-fade-up">
      <app-placeholder-section
        icon="bi bi-trophy"
        title="Cele"
        description="Twoje krotko i dlugoterminowe cele.">
      </app-placeholder-section>
    </div>

    <div *ngIf="currentSection === 'habits'" class="animate-fade-up">
      <app-placeholder-section
        icon="bi bi-check2-circle"
        title="Nawyki"
        description="Sledz swoje codzienne nawyki i rutyny.">
      </app-placeholder-section>
    </div>

    <div *ngIf="currentSection === 'settings'" class="animate-fade-up">
      <app-placeholder-section
        icon="bi bi-gear"
        title="Ustawienia"
        description="Zarzadzaj swoim kontem i preferencjami aplikacji.">
      </app-placeholder-section>
    </div>

  </main>

</div>
