<div class="login-background d-flex align-items-center justify-content-center vh-100">

    <div class="card glass-card shadow-lg p-4 p-md-5">
      <div class="card-body">
        
        <div class="text-center mb-5">
          <div class="mb-3 text-primary pastel-icon">
            <i class="bi bi-shield-lock-fill fs-1"></i>
          </div>
          <h2 class="fw-bold text-darkblue">SkrzypekApp</h2>
          <p class="text-muted-blue mb-0">Zaloguj się do panelu</p>
        </div>
  
        <form (submit)="onLogin($event)">
          <div class="form-floating mb-3">
            <input 
              type="text" 
              class="form-control glass-input" 
              id="loginInput" 
              placeholder="Login"
              [(ngModel)]="username" 
              name="username">
            <label for="loginInput" class="text-muted-blue">Login</label>
          </div>
  
          <div class="form-floating mb-4">
            <input 
              type="password" 
              class="form-control glass-input" 
              id="passInput" 
              placeholder="Hasło"
              [(ngModel)]="password" 
              name="password">
            <label for="passInput" class="text-muted-blue">Hasło</label>
          </div>
  
          <button type="submit" class="btn btn-pastel-primary w-100 py-3 fw-bold shadow-sm">
            ZALOGUJ SIĘ
          </button>
        </form>
  
      </div>
    </div>
  </div>
