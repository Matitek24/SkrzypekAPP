<div class="login-background d-flex align-items-center justify-content-center vh-100">
  <div class="card glass-card shadow-lg p-4 p-md-5">
    <div class="card-body">
      
      <div class="text-center mb-4">
        <h2 class="fw-bold text-darkblue">SkrzypekApp</h2>
        <p class="text-muted-blue">Witaj w panelu administratora</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger border-0 shadow-sm mb-4 animate__animated animate__fadeIn">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ errorMessage }}
      </div>

      <form (submit)="onLogin($event)">
        <div class="form-floating mb-3">
          <input type="text" class="form-control glass-input" id="loginInput" 
                 [(ngModel)]="username" name="username" placeholder="Login">
          <label for="loginInput">Login</label>
        </div>

        <div class="form-floating mb-4">
          <input type="password" class="form-control glass-input" id="passInput" 
                 [(ngModel)]="password" name="password" placeholder="Hasło">
          <label for="passInput">Hasło</label>
        </div>

        <button type="submit" [disabled]="isLoading" class="btn btn-pastel-primary w-100 py-3 fw-bold shadow-sm">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          {{ isLoading ? 'LOGOWANIE...' : 'ZALOGUJ SIĘ' }}
        </button>
      </form>

    </div>
  </div>
</div>
